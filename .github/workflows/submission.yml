name: Prepare accepted tool for review
on:
  issues:
    types: [labeled]
concurrency:
  group: catalog-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    if: github.event.label.name == 'catalog:accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and prepare content from the accepted issue
        run: pnpm exec tsx scripts/catalog/submission.ts prepare
      - run: pnpm catalog:build
      - run: pnpm check
      - run: pnpm build
      - name: Create a review PR
        run: pnpm exec tsx scripts/catalog/submission.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
